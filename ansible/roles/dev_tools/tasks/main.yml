---
- name: Install development tools
  apt:
    name:
      - git
      - zsh
      - tmux
      - neovim
      - python3
      - python3-pip
      - build-essential
      - postgresql-client   # psql CLI để kết nối DB
    state: present
  become: yes

- name: Create apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: yes

- name: Add GitHub CLI GPG key
  get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"
  become: yes

- name: Add GitHub CLI apt repository
  apt_repository:
    repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present
  become: yes

- name: Install GitHub CLI (gh)
  apt:
    name: gh
    state: present
    update_cache: yes
  become: yes

- name: Install uv (Python package manager)
  shell: curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/uv"

- name: Install TMUX Plugin Manager (TPM)
  git:
    repo: https://github.com/tmux-plugins/tpm
    dest: "{{ ansible_env.HOME }}/.tmux/plugins/tpm"
    version: master

- name: Install Antigen (zsh plugin manager)
  shell: |
    mkdir -p {{ ansible_env.HOME }}/.antigen/antigen
    curl -L https://raw.githubusercontent.com/zsh-users/antigen/master/bin/antigen.zsh > {{ ansible_env.HOME }}/.antigen/antigen/antigen.zsh
  args:
    creates: "{{ ansible_env.HOME }}/.antigen/antigen/antigen.zsh"

- name: Set zsh as default shell
  user:
    name: "{{ ansible_user_id }}"
    shell: /usr/bin/zsh
  become: yes

- name: Generate SSH key if not exists
  command: ssh-keygen -t ed25519 -C "{{ ansible_user_id }}@{{ ansible_hostname }}" -f {{ ansible_env.HOME }}/.ssh/id_ed25519 -N ""
  args:
    creates: "{{ ansible_env.HOME }}/.ssh/id_ed25519"

- name: Display SSH public key
  command: cat {{ ansible_env.HOME }}/.ssh/id_ed25519.pub
  register: ssh_pub_key
  changed_when: false

- name: Show SSH public key
  debug:
    msg: |
      === SSH PUBLIC KEY (add to GitHub) ===
      {{ ssh_pub_key.stdout }}
      =======================================
