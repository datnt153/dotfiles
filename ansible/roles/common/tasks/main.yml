---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: Install common utilities
  apt:
    name:
      - curl
      - wget
      - htop
      - tree
      - ncdu
      - duf
      - rsync
      - zip
      - unzip
      - neofetch
      - stow
      - jq
    state: present
  become: yes

- name: Install dust using snap
  command: snap install dust
  args:
    creates: /snap/bin/dust
  become: yes
